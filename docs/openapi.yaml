      responses:
        '200':
          description: Status verifikasi diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Store'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users:
    get:
      tags: [Admin]
      summary: Daftar pengguna
      parameters:
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/Role'
        - name: q
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Daftar pengguna
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Admin]
      summary: Aktifkan atau nonaktifkan akun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active:
                  type: boolean
      responses:
        '200':
          description: Akun diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Admin]
      summary: Hapus akun
      responses:
        '204':
          description: Akun dihapus
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/review-reports:
    get:
      tags: [Admin]
      summary: Daftar laporan ulasan
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, resolved, dismissed]
            default: open
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Daftar laporan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReviewReport'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/reviews/{reviewId}/moderation:
    patch:
      tags: [Admin]
      summary: Moderasi ulasan (tampilkan, sembunyikan, hapus)
      parameters:
        - $ref: '#/components/parameters/ReviewId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [show, hide, delete]
                note:
                  type: string
      responses:
        '200':
          description: Moderasi diterapkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/categories:
    post:
      tags: [Admin]
      summary: Tambah kategori produk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                icon:
                  type: string
      responses:
        '201':
          description: Kategori dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Admin]
      summary: Ubah kategori
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                icon:
                  type: string
      responses:
        '200':
          description: Kategori diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags: [Admin]
      summary: Hapus kategori
      responses:
        '204':
          description: Kategori dihapus
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/orders:
    get:
      tags: [Admin]
      summary: Monitoring seluruh pesanan dan status pembayaran
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: store_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Daftar pesanan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '403':
          $ref: '#/components/responses/Forbidden'
  /complaints:
    post:
      tags: [Admin]
      summary: Ajukan keluhan atau pengaduan (Konsumen/UMKM)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, description]
              properties:
                order_id:
                  type: string
                  format: uuid
                subject:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Keluhan tercatat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Complaint'
  /admin/complaints:
    get:
      tags: [Admin]
      summary: Daftar keluhan/pengaduan
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [open, in_progress, resolved]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Daftar keluhan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Complaint'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/complaints/{complaintId}:
    patch:
      tags: [Admin]
      summary: Tangani keluhan
      parameters:
        - name: complaintId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [in_progress, resolved]
                resolution_note:
                  type: string
      responses:
        '200':
          description: Keluhan diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Complaint'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/settings:
    get:
      tags: [Admin]
      summary: Ambil pengaturan platform
      responses:
        '200':
          description: Pengaturan platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Admin]
      summary: Ubah pengaturan platform
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformSettings'
      responses:
        '200':
          description: Pengaturan diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformSettings'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token dari Supabase Auth

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Latitude:
      name: lat
      in: query
      description: Latitude lokasi pengguna
      schema:
        type: number
        format: double
        example: -7.7956
    Longitude:
      name: lng
      in: query
      description: Longitude lokasi pengguna
      schema:
        type: number
        format: double
        example: 110.3695
    StoreId:
      name: storeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Token tidak ada atau tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Peran atau status akun tidak diizinkan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Data tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          example: FORBIDDEN
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    MessageResponse:
      type: object
      properties:
        message:
          type: string
    PageMeta:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
    Role:
      type: string
      enum: [consumer, seller, super_admin]
    VerificationStatus:
      type: string
      description: Status akun UMKM
      enum: [pending, approved, rejected, suspended]
    ProductStatus:
      type: string
      description: |
        Tersedia = `available`, Segera Berakhir = `ending_soon`,
        Penjualan ditutup = `closed`, Habis = `sold_out`.
      enum: [available, ending_soon, closed, sold_out]
    OrderStatus:
      type: string
      enum: [pending_payment, paid, confirmed, completed, cancelled, expired]

    RegisterRequest:
      type: object
      required: [full_name, password, role]
      description: Wajib mengisi `email` atau `phone`.
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          example: '081234567890'
        password:
          type: string
          format: password
          minLength: 8
        role:
          type: string
          enum: [consumer, seller]
    AuthResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        avatar_url:
          type: string
          format: uri
        is_verified:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    StoreInput:
      type: object
      required: [name, business_type, address, latitude, longitude, contact_phone]
      properties:
        name:
          type: string
        business_type:
          type: string
          enum: [umkm, cafe, warung_makan, supermarket, bakery, other]
        address:
          type: string
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        opening_hours:
          type: array
          items:
            type: object
            properties:
              day:
                type: string
                enum: [mon, tue, wed, thu, fri, sat, sun]
              open:
                type: string
                example: '08:00'
              close:
                type: string
                example: '21:00'
        contact_phone:
          type: string
        photo_url:
          type: string
          format: uri
    Store:
      allOf:
        - $ref: '#/components/schemas/StoreInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            owner_id:
              type: string
              format: uuid
            verification_status:
              $ref: '#/components/schemas/VerificationStatus'
            rejection_reason:
              type: string
            average_rating:
              type: number
              example: 4.5
            review_count:
              type: integer
            distance_km:
              type: number
              description: Hanya muncul jika lat/lng dikirim
            created_at:
              type: string
              format: date-time

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Roti & Kue
        icon:
          type: string

    ProductInput:
      type: object
      required: [name, category_id, normal_price, discount_price, stock, sale_start_at, order_deadline_at, pickup_deadline_at]
      properties:
        name:
          type: string
        description:
          type: string
        category_id:
          type: string
          format: uuid
        photo_url:
          type: string
          format: uri
        normal_price:
          type: integer
          example: 20000
        discount_price:
          type: integer
          example: 10000
        stock:
          type: integer
          minimum: 0
        sale_start_at:
          type: string
          format: date-time
          description: Jam mulai dijual
        order_deadline_at:
          type: string
          format: date-time
          description: Batas pemesanan
        pickup_deadline_at:
          type: string
          format: date-time
          description: Batas pengambilan
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              $ref: '#/components/schemas/ProductStatus'
            seconds_to_order_deadline:
              type: integer
              description: Untuk countdown di aplikasi
            store:
              $ref: '#/components/schemas/Store'
            average_rating:
              type: number
            review_count:
              type: integer
            distance_km:
              type: number

    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_code:
          type: string
          description: Dibuat setelah pembayaran berhasil
          example: HBS-20261001-0042
        status:
          $ref: '#/components/schemas/OrderStatus'
        product:
          $ref: '#/components/schemas/Product'
        store_id:
          type: string
          format: uuid
        consumer_id:
          type: string
          format: uuid
        quantity:
          type: integer
        total_price:
          type: integer
        note:
          type: string
        qr_code:
          type: string
          description: Payload/URL gambar QR, hanya tersedia setelah dibayar
        payment_status:
          type: string
          enum: [unpaid, paid, failed, expired]
        pickup_deadline_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        has_review:
          type: boolean
        created_at:
          type: string
          format: date-time
    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        method:
          type: string
          enum: [qris, virtual_account, ewallet]
        amount:
          type: integer
        status:
          type: string
          enum: [pending, paid, failed, expired]
        payment_url:
          type: string
          format: uri
        qris_payload:
          type: string
        expires_at:
          type: string
          format: date-time

    ReviewInput:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
        photo_url:
          type: string
          format: uri
          description: Opsional
    Review:
      allOf:
        - $ref: '#/components/schemas/ReviewInput'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            order_id:
              type: string
              format: uuid
            store_id:
              type: string
              format: uuid
            product_id:
              type: string
              format: uuid
            consumer_name:
              type: string
            seller_reply:
              type: string
            is_hidden:
              type: boolean
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    ReviewReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        review:
          $ref: '#/components/schemas/Review'
        reported_by:
          type: string
          format: uuid
        reason:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [open, resolved, dismissed]
        created_at:
          type: string
          format: date-time

    Complaint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        subject:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [open, in_progress, resolved]
        resolution_note:
          type: string
        created_at:
          type: string
          format: date-time

    SellerDashboard:
      type: object
      properties:
        active_products:
          type: integer
        orders_today:
          type: integer
        products_sold:
          type: integer
        revenue_today:
          type: integer
        remaining_stock:
          type: integer
        average_rating:
          type: number
    AdminDashboard:
      type: object
      properties:
        total_consumers:
          type: integer
        total_sellers:
          type: integer
        pending_verifications:
          type: integer
        total_transactions:
          type: integer
        total_gmv:
          type: integer
        items_saved:
          type: integer
          description: Jumlah produk berhasil terjual (indikasi makanan terselamatkan)
        open_review_reports:
          type: integer
        user_growth:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              consumers:
                type: integer
              sellers:
                type: integer
    PlatformSettings:
      type: object
      properties:
        platform_fee_percent:
          type: number
          example: 5
        payment_expiry_minutes:
          type: integer
          example: 15
        review_edit_window_hours:
          type: integer
          example: 24
        max_search_radius_km:
          type: number
          example: 10